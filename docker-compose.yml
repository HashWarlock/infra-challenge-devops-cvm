version: '3.8'

services:
  go-app:
    image: ubuntu:${UBUNTU_VERSION:-22.04}
    container_name: ${CONTAINER_NAME:-go-application}
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - GITHUB_REPO=https://github.com/HashWarlock/infra-challenge-devops-cvm.git
      - REPO_BRANCH=${REPO_BRANCH:-main}
      - COMMIT_HASH=${COMMIT_HASH:-}
      - GO_VERSION=${GO_VERSION:-1.21.5}
      - GOROOT=/usr/local/go
      - GOPATH=/go
      - PATH=/usr/local/go/bin:/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - APP_PORT=${APP_PORT:-8080}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      bash -c "
      set -e &&
      echo '========================================' &&
      echo 'Configuration:' &&
      echo '  Ubuntu Version: ${UBUNTU_VERSION:-22.04}' &&
      echo '  Go Version: $${GO_VERSION}' &&
      echo '  Repository: $${GITHUB_REPO}' &&
      echo '  Branch: $${REPO_BRANCH}' &&
      echo '  Commit Hash: $${COMMIT_HASH:-latest}' &&
      echo '========================================' &&
      echo 'Installing required packages...' &&
      apt-get update -qq &&
      apt-get install -y -qq git curl wget build-essential ca-certificates software-properties-common make &&
      echo 'Installing Go $${GO_VERSION}...' &&
      GO_TARBALL=go$${GO_VERSION}.linux-amd64.tar.gz &&
      wget -q https://go.dev/dl/$$GO_TARBALL &&
      tar -C /usr/local -xzf $$GO_TARBALL &&
      rm $$GO_TARBALL &&
      /usr/local/go/bin/go version &&
      mkdir -p /go/src /go/bin /go/pkg &&
      echo 'Cloning repository...' &&
      APP_DIR=/app/repo &&
      git clone --branch $${REPO_BRANCH} $${GITHUB_REPO} $$APP_DIR &&
      cd $$APP_DIR &&
      if [ -n \"$${COMMIT_HASH}\" ]; then
        echo 'Checking out commit: '$${COMMIT_HASH} &&
        git checkout $${COMMIT_HASH};
      fi &&
      echo 'Current commit: '$(git rev-parse HEAD) &&
      echo '========================================' &&
      echo 'Running: make build && make run' &&
      echo '========================================' &&
      make build && make run
      "